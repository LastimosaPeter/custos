services:
  - type: web
    name: custos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: custos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: adnu.edu.ph
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: SESSION_COOKIE_SECURE
        value: "1"

databases:
  - name: custos-db
    plan: free
